name: Build and Publish Image

on:
  push:
    paths-ignore:
      - '**/*.md'
    branches:
      - 'main'
      - 'cs/*'
  release:
    types:
      - released
  # Only used by delete-merged-docker-tags, to clean up a merged branch's image.
  pull_request:
    types:
      - closed

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
    # Builds main as :latest, cs/<branch> as :<branch> and releases as :<tag>.
    build-and-push:
      if: github.event_name != 'pull_request'
      runs-on: ohioit
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Determine image tag
          id: tag
          env:
            EVENT_NAME: ${{ github.event_name }}
            REF_NAME: ${{ github.ref_name }}
            RELEASE_TAG: ${{ github.event.release.tag_name }}
          # cs/renovate/ubuntu-26.x -> renovate-ubuntu-26.x. Docker tags allow
          # only [A-Za-z0-9_.-], up to 128 characters.
          run: |
            if [[ "${EVENT_NAME}" == "release" ]]; then
                TAG="${RELEASE_TAG}"
            elif [[ "${REF_NAME}" == "main" ]]; then
                TAG="latest"
            else
                TAG="${REF_NAME#cs/}"
            fi
            TAG="${TAG//[^A-Za-z0-9_.-]/-}"
            echo "tag=${TAG:0:128}" >> "$GITHUB_OUTPUT"
        # The runner's ~/.docker/config.json is a bind-mounted file, so Docker
        # can't save a login to it ("rename ... device or resource busy"). Use
        # a per-job copy, keeping its settings and CLI plugins (buildx).
        - name: Use a job-local Docker config
          run: |
            JOB_DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
            mkdir -p "${JOB_DOCKER_CONFIG}"
            if [[ -f "${HOME}/.docker/config.json" ]]; then
                cp "${HOME}/.docker/config.json" "${JOB_DOCKER_CONFIG}/config.json"
            fi
            if [[ -d "${HOME}/.docker/cli-plugins" ]]; then
                ln -sfn "${HOME}/.docker/cli-plugins" "${JOB_DOCKER_CONFIG}/cli-plugins"
            fi
            echo "DOCKER_CONFIG=${JOB_DOCKER_CONFIG}" >> "$GITHUB_ENV"
        - name: Log in to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        - name: Build and push image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            annotations: |
              git-repo=${{ github.repository }}
              git-sha=${{ github.sha }}
            cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
            cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
            provenance: true
            sbom: true

    delete-merged-docker-tags:
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'cs/')
      runs-on: ohioit
      permissions:
        packages: write
      steps:
        - name: Determine tag name from branch name
          id: tag
          env:
            BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          # Must match build-and-push-branch.
          run: |
            TAG="${BRANCH_NAME#cs/}"
            TAG="${TAG//[^A-Za-z0-9_.-]/-}"
            echo "tag=${TAG:0:128}" >> "$GITHUB_OUTPUT"
        - name: Delete the branch's image tag
          uses: actions/github-script@v7
          env:
            IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          with:
            script: |
              // GHCR doesn't support deleting through the registry API, so use
              // the Packages API: find the version carrying the tag and delete it.
              const org = context.repo.owner;
              const packageName = context.repo.repo;
              const tag = process.env.IMAGE_TAG;
              const versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                { org, package_type: 'container', package_name: packageName, per_page: 100 },
              );
              const matches = versions.filter(
                (version) => (version.metadata?.container?.tags ?? []).includes(tag),
              );
              if (matches.length === 0) {
                core.info(`No ${packageName}:${tag} image to delete.`);
                return;
              }
              for (const version of matches) {
                const otherTags = version.metadata.container.tags.filter((t) => t !== tag);
                if (otherTags.length > 0) {
                  // The same image is also tagged e.g. latest; deleting the
                  // version would remove those tags too.
                  core.info(`Keeping version ${version.id}; it is also tagged ${otherTags.join(', ')}.`);
                  continue;
                }
                await github.rest.packages.deletePackageVersionForOrg({
                  org, package_type: 'container', package_name: packageName, package_version_id: version.id,
                });
                core.info(`Deleted ${packageName}:${tag} (version ${version.id}).`);
              }
